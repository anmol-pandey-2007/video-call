<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Call</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #14161a; color: #eee;
         height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #status { color: #9aa4b2; font-size: 14px; }
  #stage { flex: 1; position: relative; background: #000; min-height: 0; }
  #remote { width: 100%; height: 100%; object-fit: contain; }
  #local { position: absolute; right: 16px; bottom: 16px; width: 22%; min-width: 110px;
           border-radius: 8px; border: 2px solid #333; transform: scaleX(-1); background: #222; }
  footer { padding: 12px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2b303a; color: #eee;
           font-size: 15px; cursor: pointer; }
  button:hover { background: #3a414e; }
  button.off { background: #7a2e2e; }
  #hangup { background: #c0392b; }
</style>
</head>
<body>
<header>
  <strong>Video Call</strong>
  <span id="status">Starting camera…</span>
</header>

<div id="stage">
  <video id="remote" autoplay playsinline></video>
  <video id="local" autoplay playsinline muted></video>
</div>

<footer>
  <button id="copy">Copy invite link</button>
  <button id="mic">Mute</button>
  <button id="cam">Camera off</button>
  <button id="hangup">Hang up</button>
</footer>

<script>
const $ = id => document.getElementById(id);
const setStatus = t => $("status").textContent = t;

// The room code lives in the URL (#abc123), so the link itself is the invite.
if (!location.hash) location.hash = Math.random().toString(36).slice(2, 10);
const room = location.hash.slice(1);

// The first person to open the link registers under this fixed ID and waits.
// The second person finds that ID is taken, so they know to call it instead.
const HOST_ID = "simple-video-call-" + room;

let peer = null, call = null, localStream = null;
let wasConnected = false, hungUp = false, callTimer = null;

function resetPeer() {
  clearTimeout(callTimer);
  if (call) { try { call.close(); } catch (e) {} call = null; }
  if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
  $("remote").srcObject = null;
  wasConnected = false;
}

// Called when the other person leaves or the connection drops: go back to waiting.
function otherSideEnded() {
  if (hungUp || !wasConnected) return;
  resetPeer();
  setStatus("The other person left. Waiting for someone to join…");
  setTimeout(join, 1500);
}

function watchCall(c) {
  call = c;
  c.on("stream", stream => {
    clearTimeout(callTimer);
    $("remote").srcObject = stream;
    wasConnected = true;
    setStatus("Connected");
  });
  c.on("close", otherSideEnded);
  c.on("error", err => console.error("call error", err));
  // PeerJS does not always report the other side closing, so watch the connection too.
  const pc = c.peerConnection;
  if (pc) pc.addEventListener("connectionstatechange", () => {
    if (["disconnected", "failed", "closed"].includes(pc.connectionState)) otherSideEnded();
  });
}

function join() {
  if (hungUp) return;
  const me = new Peer(HOST_ID);          // try to be the first person in the room
  peer = me;

  me.on("open", () => setStatus("Waiting for someone to join — send them the invite link"));

  me.on("call", incoming => {
    if (call) { incoming.close(); return; }   // already in a call: room is full
    incoming.answer(localStream);
    watchCall(incoming);
  });

  me.on("error", err => {
    if (peer !== me) return;
    if (err.type === "unavailable-id") {       // someone is already waiting: call them
      me.destroy();
      joinAsCaller();
    } else {
      console.error(err);
      setStatus("Connection problem (" + err.type + "). Retrying…");
      resetPeer();
      setTimeout(join, 3000);
    }
  });

  me.on("disconnected", () => { if (peer === me && !me.destroyed) me.reconnect(); });
}

function joinAsCaller() {
  if (hungUp) return;
  const me = new Peer();                 // random ID
  peer = me;

  me.on("open", () => {
    setStatus("Calling…");
    watchCall(me.call(HOST_ID, localStream));
    callTimer = setTimeout(() => {
      if (!wasConnected) setStatus("Couldn't connect. The room may already have two people, or one network is blocking the call.");
    }, 20000);
  });

  me.on("error", err => {
    if (peer !== me) return;
    console.error(err);
    resetPeer();
    if (err.type === "peer-unavailable") {
      setTimeout(join, 1500);            // the waiting person vanished: take their place
    } else {
      setStatus("Connection problem (" + err.type + "). Retrying…");
      setTimeout(join, 3000);
    }
  });
}

async function start() {
  if (!navigator.mediaDevices) {
    setStatus("Camera needs https:// or localhost. Open this page from a hosted link.");
    return;
  }
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch (err) {
    setStatus("Could not open camera/microphone: " + err.message);
    return;
  }
  $("local").srcObject = localStream;
  setStatus("Connecting…");
  join();
}

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $("copy").textContent = "Copied!"; }
  catch (e) { prompt("Copy this link:", location.href); }
  setTimeout(() => $("copy").textContent = "Copy invite link", 1500);
};
$("mic").onclick = () => {
  if (!localStream) return;
  const t = localStream.getAudioTracks()[0];
  t.enabled = !t.enabled;
  $("mic").textContent = t.enabled ? "Mute" : "Unmute";
  $("mic").classList.toggle("off", !t.enabled);
};
$("cam").onclick = () => {
  if (!localStream) return;
  const t = localStream.getVideoTracks()[0];
  t.enabled = !t.enabled;
  $("cam").textContent = t.enabled ? "Camera off" : "Camera on";
  $("cam").classList.toggle("off", !t.enabled);
};
$("hangup").onclick = () => {
  hungUp = true;
  resetPeer();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  $("local").srcObject = null;
  setStatus("Call ended. Reload the page to start again.");
};

// Free the room straight away when the tab is closed.
window.addEventListener("pagehide", () => { if (peer) peer.destroy(); });

start();
</script>
</body>
</html>
